services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litterbox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litterbox}
      - TUYA_DEVICE_ID=${TUYA_DEVICE_ID}
      - TUYA_DEVICE_IP=${TUYA_DEVICE_IP}
      - TUYA_API_KEY=${TUYA_API_KEY}
      - TUYA_API_SECRET=${TUYA_API_SECRET}
      - TUYA_API_REGION=${TUYA_API_REGION}
      - SNAPSHOT_INTERVAL_SECONDS=300
      - APP_TIMEZONE=${APP_TIMEZONE:-Europe/Amsterdam}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads_data:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-litterbox}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-litterbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litterbox}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
